<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile — TeamFinder</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<main>
  <h1 id="name">—</h1>
  <p class="sub" id="sub">—</p>

  <div class="card row">
    <div>
      <label style="margin-bottom:2px;">Connections</label>
      <div style="font-size:22px;font-weight:700;" id="connCount">0</div>
    </div>
    <div>
      <label style="margin-bottom:2px;">Active advertisements</label>
      <div style="font-size:22px;font-weight:700;" id="adCount">0</div>
    </div>
    <div>
      <label style="margin-bottom:2px;">Teams you lead</label>
      <div style="font-size:22px;font-weight:700;" id="teamCount">0</div>
    </div>
  </div>

  <h2>My advertisements</h2>
  <p class="sub" style="margin-top:-8px;">Requirements you've referenced under your profile, visible to your connections.</p>
  <div id="adsList"></div>

  <p class="sub" style="margin-bottom:28px;">Manage these on the <a href="/team.html" style="color:var(--accent)">Teams &amp; Advertising</a> page.</p>

  <!-- Edit Profile Details Section -->
  <h2>Profile Details</h2>
  <div class="card" style="margin-bottom:24px;">
    <h3 style="margin:0 0 12px; font-size:15px;">Edit Profile Details</h3>

    <label for="profileName">Full Name</label>
    <input id="profileName" placeholder="Enter your full name" />

    <label for="profileBranch">Branch</label>
    <select id="profileBranch">
      <option value="CSE">CSE</option>
      <option value="CD">CD</option>
      <option value="CY">CY</option>
      <option value="CI">CI</option>
      <option value="CH">CH</option>
      <option value="ISE">ISE</option>
      <option value="BT">BT</option>
      <option value="EC">EC</option>
      <option value="EE">EE</option>
      <option value="ET">ET</option>
      <option value="CV">CV</option>
      <option value="ME">ME</option>
      <option value="ASE">ASE</option>
      <option value="IM">IM</option>
    </select>

    <div id="updateProfileMsg"></div>
    <button id="updateProfileBtn">Save Profile Details</button>
  </div>

  <!-- Security & Change Password Section -->
  <h2>Security &amp; Account</h2>
  <div class="card">
    <h3 style="margin:0 0 12px; font-size:15px;">Change Password</h3>

    <label for="currentPassword">Current Password</label>
    <div class="password-wrap">
      <input id="currentPassword" type="password" placeholder="Enter current password" autocomplete="current-password" />
      <button type="button" class="toggle-password" id="toggleCurrentPasswordBtn" title="Toggle password visibility">👁️</button>
    </div>

    <label for="newPassword">New Password</label>
    <div class="password-wrap">
      <input id="newPassword" type="password" placeholder="Min 6 characters" />
      <button type="button" class="toggle-password" id="toggleNewPasswordBtn" title="Toggle password visibility">👁️</button>
    </div>

    <div id="changePasswordMsg"></div>
    <button id="changePasswordBtn">Update Password</button>
  </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
