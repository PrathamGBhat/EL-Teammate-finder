<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find a Teammate — TeamFinder</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<main>
  <h1>Find a teammate</h1>
  <p class="sub">Searches through <em>your connections'</em> advertisements — not the whole platform.</p>

  <div class="card">
    <label for="branchInput">Desired branch</label>
    <select id="branchInput">
      <option value="" disabled selected>Select Desired Branch</option>
      <option value="CSE">CSE</option>
      <option value="CD">CD</option>
      <option value="CY">CY</option>
      <option value="CI">CI</option>
      <option value="ISE">ISE</option>
      <option value="BT">BT</option>
      <option value="EC">EC</option>
      <option value="EE">EE</option>
      <option value="ET">ET</option>
      <option value="CV">CV</option>
      <option value="ME">ME</option>
      <option value="ASE">ASE</option>
      <option value="IM">IM</option>
    </select>
    <button id="searchBtn">Search</button>
  </div>

  <h2>Results</h2>
  <div id="results"></div>
</main>

<script src="/js/common.js"></script>
<script src="/js/search.js"></script>
</body>
</html>
