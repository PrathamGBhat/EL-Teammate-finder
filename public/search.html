<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find Vacant Spots — TeamFinder</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<main>
  <h1>Find Vacant Team Spots</h1>
  <p class="sub">Find open team requirements matching your target branch advertised across your connection network.</p>

  <div class="card">
    <label for="branchInput">Target Branch</label>
    <select id="branchInput" style="margin-bottom:0;">
      <option value="" disabled selected>Select Target Branch</option>
      <option value="CSE">CSE</option>
      <option value="CD">CD</option>
      <option value="CY">CY</option>
      <option value="CI">CI</option>
      <option value="ISE">ISE</option>
      <option value="BT">BT</option>
      <option value="EC">EC</option>
      <option value="EE">EE</option>
      <option value="ET">ET</option>
      <option value="CV">CV</option>
      <option value="ME">ME</option>
      <option value="ASE">ASE</option>
      <option value="IM">IM</option>
    </select>
  </div>

  <h2>Vacant Spot Results</h2>
  <div id="results"></div>
</main>

<script src="/js/common.js"></script>
<script src="/js/search.js"></script>
</body>
</html>
