<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find a Teammate — TeamFinder</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<main>
  <h1>Find a teammate</h1>
  <p class="sub">Searches through <em>your connections'</em> advertisements — not the whole platform.</p>

  <div class="card">
    <label for="branchInput">Desired branch</label>
    <input id="branchInput" placeholder="e.g. ECE" />
    <button id="searchBtn">Search</button>
  </div>

  <h2>Results</h2>
  <div id="results"></div>
</main>

<script src="/js/common.js"></script>
<script src="/js/search.js"></script>
</body>
</html>
